<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Credit Card / Wallet shape in back -->
  <rect x="96" y="128" width="320" height="190" rx="28" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="96" y="170" width="320" height="38" fill="#1e1b4b" fill-opacity="0.6" />
  <rect x="132" y="240" width="60" height="44" rx="10" fill="#fbbf24" fill-opacity="0.9" />

  <!-- Front Wallet / Coin / Bill symbol with Euro sign -->
  <g filter="url(#shadow)">
    <!-- Floating Money / Cash Badge -->
    <rect x="120" y="230" width="272" height="170" rx="32" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <rect x="136" y="246" width="240" height="138" rx="24" fill="#1e293b" />
    
    <!-- Cash Accent border -->
    <rect x="152" y="262" width="208" height="106" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Euro Symbol in Center -->
    <text x="256" y="338" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="76" font-weight="900" fill="#10b981" text-anchor="middle">€</text>
  </g>

  <!-- Sparkle dots -->
  <circle cx="110" cy="110" r="8" fill="#34d399" />
  <circle cx="410" cy="110" r="12" fill="#6366f1" />
  <circle cx="416" cy="410" r="10" fill="#fbbf24" />
  <circle cx="96" cy="400" r="6" fill="#38bdf8" />
</svg>
